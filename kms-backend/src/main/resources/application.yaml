server:
  # 8080 已被本机其他服务占用（实测），固定使用 8090。
  # 前端 kms-frontend 的 api 层必须与此一致。
  port: 8090

spring:
  application:
    name: kms
  # 真实密钥/密码放 application-local.yaml（已 gitignore）
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kms?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  ai:
    openai:
      # DeepSeek 的 OpenAI 兼容端点。
      # 不用 /anthropic 端点：那边的流式响应含 thinking 内容块，
      # Spring AI 1.0.0-M6 不认识该类型会直接报错（见 pom.xml 的说明）。
      base-url: https://api.deepseek.com
      # 真实密钥由 application-local.yaml 覆盖。
      # 这里给一个占位默认值是必要的：Spring AI 的自动配置以 api-key 存在为前提，
      # 完全不给会导致应用启动失败，而未启用 RAG 时我们并不需要它。
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      chat:
        options:
          model: deepseek-flash
          # deepseek-flash 先产出推理内容再产出正文，max-tokens 要留足，
          # 否则会出现「想完了但没额度写答案」（实测 64 就复现）
          max-tokens: 16384
          # 刻意不设 temperature：DeepSeek 的推理模型对采样参数另有约束，
          # 用服务端默认值更稳
      # 必须禁用 OpenAI 自动配置的向量 bean：向量走火山方舟（只支持多模态端点），
      # 由自研的 VolcArkEmbeddingModel 提供。不禁用的话容器里会有两个
      # EmbeddingModel，vectorStore 注入时直接报 NoUniqueBeanDefinitionException。
      embedding:
        enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  upload-dir: uploads
  search:
    weight:
      title: 3.0
      summary: 2.0
      content: 1.0

  rag:
    # 默认关闭。配好密钥后改为 true（密钥放 application-local.yaml）。
    # 关闭时问答接口返回可读提示，其余功能完全不受影响。
    enabled: false
    retrieve:
      top-k: 5
      # 相似度低于此值不喂给模型，避免拿无关内容诱导编造
      min-score: 0.3
    chunk:
      max-length: 500
      overlap: 80
    vector-store:
      path: data/vector-index.json
    embedding:
      model: doubao-embedding-vision-251215
      # 单条向量化约 350ms 且端点不支持批量，并发是唯一提速手段
      concurrency: 8

logging:
  level:
    com.njupt.kms: DEBUG
