# 集成测试配置。
#
# 激活方式：@ActiveProfiles({"local", "test"})
#   - local 提供 MySQL 账号密码（application-local.yaml 已在 .gitignore 中）
#   - test  提供本文件里的测试专用库与上传目录
#
# 本文件**不含任何凭据**，可以安全提交。凭据只在被 gitignore 的
# application-local.yaml 中，两者通过 profile 叠加生效。
# 若只激活 test 而不激活 local，Spring Boot 会因缺少 datasource 凭据而启动失败——
# 这是刻意的：宁可启动失败，也不在仓库里塞默认密码。

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/kms_test?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true

app:
  upload-dir: target/test-uploads
