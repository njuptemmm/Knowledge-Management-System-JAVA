server:
  # 8080 已被本机其他服务占用（实测），固定使用 8090。
  # 前端 kms-frontend 的 api 层必须与此一致。
  port: 8090

spring:
  application:
    name: kms
  # 真实密钥/密码放 application-local.yaml（已 gitignore）
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kms?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  ai:
    openai:
      base-url: https://api.moonshot.cn
      # 真实密钥由 application-local.yaml 覆盖。
      # 这里给一个占位默认值是必要的：Spring AI 的自动配置以 api-key 存在为前提，
      # 完全不给会导致应用启动失败，而未启用 RAG 时我们并不需要它。
      api-key: ${KIMI_API_KEY:not-configured}
      chat:
        options:
          model: kimi-k2.6
          # kimi-k2.6 只接受温度 1，改别的值直接 HTTP 400
          # （实测：invalid temperature: only 1 is allowed for this model）
          temperature: 1
      # 向量不走 OpenAI 自动配置：火山方舟的向量模型只支持 /embeddings/multimodal，
      # 由自研的 VolcArkEmbeddingModel 调用。此 bean 必须禁用，否则两者冲突。
      embedding:
        enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  upload-dir: uploads
  search:
    weight:
      title: 3.0
      summary: 2.0
      content: 1.0

  rag:
    # 默认关闭。配好密钥后改为 true（密钥放 application-local.yaml）。
    # 关闭时问答接口返回可读提示，其余功能完全不受影响。
    enabled: false
    retrieve:
      top-k: 5
      # 相似度低于此值不喂给模型，避免拿无关内容诱导编造
      min-score: 0.3
    chunk:
      max-length: 500
      overlap: 80
    vector-store:
      path: data/vector-index.json
    embedding:
      model: doubao-embedding-vision-251215
      # 单条向量化约 350ms 且端点不支持批量，并发是唯一提速手段
      concurrency: 8

logging:
  level:
    com.njupt.kms: DEBUG
